# linux-submit.sh — what the Linux packages say about this app.
# One set of answers for every distro; edit freely, commit it with the app.
# The version and release tag come from each release, not from here.

runtime-deps = bash
optional-deps = apksigner curl fdroid file flutter gh git glab keytool python3 ssh ssh-keygen ssh-keyscan strings task unzip xdg-open
