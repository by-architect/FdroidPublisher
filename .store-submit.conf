# linux-submit.sh — what the Linux packages say about this app.
# One set of answers for every distro; edit freely, commit it with the app.
# The version and release tag come from each release, not from here.

runtime-deps = bash
optional-deps = apksigner curl fdroid file flutter gh git glab keytool python3 ssh ssh-keygen ssh-keyscan strings task unzip xdg-open
name = fdroidpublisher
build-system = custom
description = Make publishing easier to fdroid
license = GPL-3.0-or-later
homepage = https://github.com/by-architect/FdroidPublisher
main-program = fdroidPublisher
maintainer-name = byarchitect
maintainer-email = byarchitect@disroot.org
copr-project = fdroidpublisher
copr-chroots = fedora-45-x86_64 fedora-45-aarch64 fedora-44-x86_64 fedora-44-aarch64 fedora-43-x86_64 fedora-43-aarch64
distros = nix copr
